<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 920 1210"
     width="920" height="1210"
     preserveAspectRatio="xMidYMid meet"
     font-family="Inter, system-ui, sans-serif">

  <defs>
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4A2E1B" flood-opacity="0.10"/>
    </filter>
    <g id="flow-down">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#4A2E1B" stroke-width="2" stroke-linecap="round"/>
      <path d="M-5,12 L0,20 L5,12" fill="none" stroke="#4A2E1B"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <clipPath id="text-col-clip">
      <rect x="96" y="0" width="388" height="208"/>
    </clipPath>
  </defs>

  <rect width="920" height="1210" rx="18" fill="#FDF8F0"/>

  <!-- STAGE 1 -->
  <g transform="translate(36, 16)">
    <rect width="848" height="208" rx="20" fill="#FFFFFF"
          stroke="#E3BA45" stroke-width="2.5" filter="url(#card-shadow)"/>
    <circle cx="52" cy="66" r="30" fill="#4A2E1B"/>
    <text x="52" y="66" font-family="Merriweather, serif" font-size="30"
          font-weight="900" fill="#E3BA45" text-anchor="middle" dominant-baseline="central">1</text>
    <g clip-path="url(#text-col-clip)">
      <text x="100" y="54" font-size="30" font-weight="900" fill="#4A2E1B" dominant-baseline="central">LABELED AUDIO CLIPS</text>
      <text x="100" y="88" font-size="26" font-weight="600" fill="#8B6F4A" dominant-baseline="central">Manual Taal annotation</text>
      <line x1="100" y1="124" x2="384" y2="124" stroke="#E3BA45" stroke-width="1.5" stroke-dasharray="4,5" opacity="0.55"/>
      <text x="100" y="154" font-size="24" font-weight="700" fill="#4A2E1B" dominant-baseline="central">1,266 clips · Bhajani, Dadra, Keherwa</text>
      <text x="100" y="184" font-size="24" font-weight="600" fill="#8B6F4A" dominant-baseline="central">Fixed 20s windows with beat labels</text>
    </g>
    <g transform="translate(562, 26)">
      <rect width="278" height="108" rx="12" fill="#FDF8F0" stroke="#E3BA45" stroke-width="1.5"/>
      <path d="M20,54 Q34,18 48,54 T76,54 T104,54 T132,54 T160,54 T188,54 T216,54 T252,54"
            fill="none" stroke="#4A2E1B" stroke-width="3" stroke-linecap="round"/>
      <text x="139" y="92" font-size="20" font-weight="700" fill="#8B6F4A"
            text-anchor="middle" dominant-baseline="central">20s segments</text>
    </g>
  </g>

  <use href="#flow-down" transform="translate(460, 232)"/>

  <!-- STAGE 2 -->
  <g transform="translate(36, 260)">
    <rect width="848" height="208" rx="20" fill="#FFFFFF"
          stroke="#E3BA45" stroke-width="2.5" filter="url(#card-shadow)"/>
    <circle cx="52" cy="66" r="30" fill="#4A2E1B"/>
    <text x="52" y="66" font-family="Merriweather, serif" font-size="30"
          font-weight="900" fill="#E3BA45" text-anchor="middle" dominant-baseline="central">2</text>
    <g clip-path="url(#text-col-clip)">
      <text x="100" y="54" font-size="30" font-weight="900" fill="#4A2E1B" dominant-baseline="central">MEL-SPECTROGRAM FEATURES</text>
      <text x="100" y="88" font-size="26" font-weight="600" fill="#8B6F4A" dominant-baseline="central">librosa DSP</text>
      <line x1="100" y1="124" x2="384" y2="124" stroke="#E3BA45" stroke-width="1.5" stroke-dasharray="4,5" opacity="0.55"/>
      <text x="100" y="154" font-size="24" font-weight="700" fill="#4A2E1B" dominant-baseline="central">Waveform → 128×862 mel tensor</text>
      <text x="100" y="184" font-size="24" font-weight="600" fill="#8B6F4A" dominant-baseline="central">Per-channel normalization</text>
    </g>
    <g transform="translate(584, 38)">
      <clipPath id="spec-photo-clip">
        <rect x="2" y="2" width="248" height="96" rx="8"/>
      </clipPath>
      <rect width="252" height="100" rx="10" fill="#FDF8F0" stroke="#E3BA45" stroke-width="1.5"/>
      <image href="Spectrogram.jpg" x="2" y="2" width="248" height="96"
             preserveAspectRatio="xMidYMid meet" clip-path="url(#spec-photo-clip)"/>
    </g>
  </g>

  <use href="#flow-down" transform="translate(460, 476)"/>

  <!-- STAGE 3 -->
  <g transform="translate(36, 504)">
    <rect width="848" height="208" rx="20" fill="#FFFFFF"
          stroke="#E3BA45" stroke-width="2.5" filter="url(#card-shadow)"/>
    <circle cx="52" cy="66" r="30" fill="#4A2E1B"/>
    <text x="52" y="66" font-family="Merriweather, serif" font-size="30"
          font-weight="900" fill="#E3BA45" text-anchor="middle" dominant-baseline="central">3</text>
    <g clip-path="url(#text-col-clip)">
      <text x="100" y="54" font-size="30" font-weight="900" fill="#4A2E1B" dominant-baseline="central">TRAIN / VALIDATION SPLIT</text>
      <text x="100" y="88" font-size="26" font-weight="600" fill="#8B6F4A" dominant-baseline="central">Stratified hold-out</text>
      <line x1="100" y1="124" x2="384" y2="124" stroke="#E3BA45" stroke-width="1.5" stroke-dasharray="4,5" opacity="0.55"/>
      <text x="100" y="154" font-size="24" font-weight="700" fill="#4A2E1B" dominant-baseline="central">80/20 split · class-balanced</text>
      <text x="100" y="184" font-size="24" font-weight="600" fill="#8B6F4A" dominant-baseline="central">858 spectrograms in the dataset</text>
    </g>
    <g transform="translate(562, 30)">
      <rect width="278" height="112" rx="12" fill="#FDF8F0" stroke="#E3BA45" stroke-width="1.5"/>
      <rect x="14" y="20" width="198" height="36" rx="8" fill="#4A2E1B"/>
      <rect x="212" y="20" width="52" height="36" rx="8" fill="#E3BA45"/>
      <text x="113" y="38" font-size="20" font-weight="800" fill="#E3BA45"
            text-anchor="middle" dominant-baseline="central">80% train</text>
      <text x="238" y="38" font-size="19" font-weight="800" fill="#4A2E1B"
            text-anchor="middle" dominant-baseline="central">20%</text>
      <text x="139" y="88" font-size="20" font-weight="700" fill="#8B6F4A"
            text-anchor="middle" dominant-baseline="central">858 spectrograms</text>
    </g>
  </g>

  <use href="#flow-down" transform="translate(460, 720)"/>

  <!-- STAGE 4 -->
  <g transform="translate(36, 748)">
    <rect width="848" height="208" rx="20" fill="#FFFFFF"
          stroke="#E3BA45" stroke-width="2.5" filter="url(#card-shadow)"/>
    <circle cx="52" cy="66" r="30" fill="#4A2E1B"/>
    <text x="52" y="66" font-family="Merriweather, serif" font-size="30"
          font-weight="900" fill="#E3BA45" text-anchor="middle" dominant-baseline="central">4</text>
    <g clip-path="url(#text-col-clip)">
      <text x="100" y="54" font-size="30" font-weight="900" fill="#4A2E1B" dominant-baseline="central">CNN TRAINING</text>
      <text x="100" y="88" font-size="26" font-weight="600" fill="#8B6F4A" dominant-baseline="central">TensorFlow / Keras</text>
      <line x1="100" y1="124" x2="384" y2="124" stroke="#E3BA45" stroke-width="1.5" stroke-dasharray="4,5" opacity="0.55"/>
      <text x="100" y="154" font-size="24" font-weight="700" fill="#4A2E1B" dominant-baseline="central">Conv2D + MaxPool(2,3) · 30 epochs</text>
      <text x="100" y="184" font-size="24" font-weight="600" fill="#8B6F4A" dominant-baseline="central">Adam optimizer · val curve tracked</text>
    </g>
    <g transform="translate(562, 22)">
      <rect width="278" height="116" rx="12" fill="#FDF8F0" stroke="#E3BA45" stroke-width="1.5"/>
      <line x1="18" y1="96" x2="260" y2="96" stroke="#E3BA45" stroke-width="1.5" opacity="0.65"/>
      <line x1="18" y1="96" x2="18" y2="16" stroke="#E3BA45" stroke-width="1.5" opacity="0.65"/>
      <path d="M18,92 L54,78 L90,62 L126,44 L162,30 L198,18 L234,10 L260,4"
            fill="none" stroke="#4A2E1B" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M18,92 L54,84 L90,72 L126,58 L162,46 L198,36 L234,28 L260,20"
            fill="none" stroke="#8B3A2B" stroke-width="2.5" stroke-dasharray="5,4"
            stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>

  <use href="#flow-down" transform="translate(460, 964)"/>

  <!-- STAGE 5 -->
  <g transform="translate(36, 992)">
    <rect width="848" height="208" rx="20" fill="#FFFFFF"
          stroke="#E3BA45" stroke-width="2.5" filter="url(#card-shadow)"/>
    <circle cx="52" cy="66" r="30" fill="#4A2E1B"/>
    <text x="52" y="66" font-family="Merriweather, serif" font-size="30"
          font-weight="900" fill="#E3BA45" text-anchor="middle" dominant-baseline="central">5</text>
    <g clip-path="url(#text-col-clip)">
      <text x="100" y="54" font-size="30" font-weight="900" fill="#4A2E1B" dominant-baseline="central">DEPLOY TO INFERENCE</text>
      <text x="100" y="88" font-size="26" font-weight="600" fill="#8B6F4A" dominant-baseline="central">Production model artifact</text>
      <line x1="100" y1="124" x2="384" y2="124" stroke="#E3BA45" stroke-width="1.5" stroke-dasharray="4,5" opacity="0.55"/>
      <text x="100" y="154" font-size="24" font-weight="700" fill="#4A2E1B" dominant-baseline="central">.keras weights packaged in Docker</text>
      <text x="100" y="184" font-size="24" font-weight="600" fill="#8B6F4A" dominant-baseline="central">FastAPI loads model at startup</text>
    </g>
    <g transform="translate(562, 28)" font-size="19" font-weight="700">
      <rect x="0" y="0" width="118" height="46" rx="22" fill="#4A2E1B" stroke="#E3BA45" stroke-width="1.5"/>
      <text x="59" y="23" fill="#E3BA45" text-anchor="middle" dominant-baseline="central">.keras</text>
      <rect x="128" y="0" width="118" height="46" rx="22" fill="#E3BA45" stroke="#4A2E1B" stroke-width="1.5"/>
      <text x="187" y="23" fill="#4A2E1B" text-anchor="middle" dominant-baseline="central">Docker</text>
      <rect x="0" y="54" width="246" height="46" rx="22" fill="#8B3A2B" stroke="#E3BA45" stroke-width="1.5"/>
      <text x="123" y="77" fill="#FDF8F0" text-anchor="middle" dominant-baseline="central">FastAPI inference</text>
    </g>
  </g>

</svg>
